<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor do Jornal da Liga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --cor-fundo-escuro: #1a1a1d; --cor-container-escuro: #2c2f33; --cor-texto-principal-claro: #e0e0e0;
            --cor-texto-secundario-claro: #a0a0a0; --cor-borda-escura: #4a4a4a; --cor-header-tabela: #2563eb;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--cor-fundo-escuro); color: var(--cor-texto-principal-claro); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 20px auto; background: var(--cor-container-escuro); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border: 1px solid var(--cor-borda-escura); }
        h1, h2 { text-align: center; border-bottom: 1px solid var(--cor-borda-escura); padding-bottom: 15px; margin-top: 0; margin-bottom: 25px;}
        .back-link { display: block; text-align: center; margin-top: 30px; text-decoration: none; color: var(--cor-header-tabela); font-weight: bold; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 20px; }
        label { margin-bottom: 5px; color: var(--cor-texto-secundario-claro); font-weight: 500; }
        input, textarea, button, select { padding: 12px; border-radius: 6px; border: 1px solid var(--cor-borda-escura); font-size: 16px; width: 100%; box-sizing: border-box; background-color: #3d3d4d; color: var(--cor-texto-principal-claro); font-family: 'Inter', sans-serif; }
        textarea { resize: vertical; }
        button { background-color: #c82333; color: white; font-weight: bold; cursor: pointer; border: none; transition: background-color 0.2s; }
        button:hover { background-color: #a21927; }
        .match-selection-item { background: #3d3d4d; border: 1px solid var(--cor-borda-escura); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .match-label { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 18px; }
        .match-summary { margin-top: 10px; }
        input[type="file"] { padding: 5px; }
        .hidden { display: none; }
        .classification-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .classification-row .pos-input { flex: 0.5; text-align: center; }
        .classification-row .player-name-hidden { flex: 3; }
        .classification-row .player-label { flex: 3; margin-bottom: 0; font-weight: normal; color: var(--cor-texto-principal-claro); }
        .classification-row input[type="number"] { flex: 1; }
        #classification-list-container button { font-size: 14px; padding: 8px 12px; width: auto; background-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Editor do Jornal da Liga</h1>
        <form action="{{ url_for('jornal_liga') }}" method="post" enctype="multipart/form-data">
            <h2>1. Detalhes da Edição</h2>
            <div class="form-group">
                <label for="edicao">Número da Edição</label>
                <input type="number" name="edicao" id="edicao" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label for="editorial">Manchete / Citação Principal da Rodada</label>
                <textarea name="editorial" id="editorial" rows="3" required placeholder="Ex: Uma rodada de tirar o fôlego que redefiniu o topo da tabela!"></textarea>
            </div>
            
            <h2>2. Matérias da Rodada</h2>
            {% for partida in partidas_recentes %}
            <div class="match-selection-item">
                <label class="match-label">
                    <input type="checkbox" name="partidas_selecionadas" value="{{ partida.id }}" style="width: auto; height: 18px; flex-shrink: 0;">
                    {{ partida.jogador_a }} vs {{ partida.jogador_b }} ({{ partida.torneio }})
                </label>
                <div class="match-summary">
                    <textarea name="resumo_{{ partida.id }}" rows="3" placeholder="Escreva o resumo desta partida aqui..."></textarea>
                    <label style="margin-top: 10px; font-size: 14px;">Imagem de Destaque (Opcional)</label>
                    <input type="file" name="imagem_{{ partida.id }}" accept="image/png, image/jpeg, image/gif">
                </div>
            </div>
            {% endfor %}

            <h2>3. Módulos Opcionais para o Final do Jornal</h2>
            <div class="match-selection-item">
                <label class="match-label">
                    <input type="checkbox" name="incluir_ranking_elo" value="true" style="width: auto; height: 18px; flex-shrink: 0;">
                    Incluir Ranking de Treinadores (ELO Geral)
                </label>
            </div>
            <div class="match-selection-item">
                <label class="match-label">
                    <input type="checkbox" name="incluir_classificacao" id="check_classificacao" value="true" style="width: auto; height: 18px; flex-shrink: 0;" onchange="toggleClassification()">
                    Incluir Classificação do Campeonato
                </label>
                <div id="classificacao-container" class="hidden" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="torneio_classificacao">Selecione o Campeonato</label>
                        <select name="nome_campeonato" id="torneio_classificacao" onchange="populatePlayers()">
                            <option value="">Selecione...</option>
                            {% for t in todos_torneios %}
                                <option value="{{ t.nome }}">{{ t.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <hr style="border-color: var(--cor-borda-escura); margin-bottom: 15px;">
                    <div id="classification-list-container">
                        <label>Insira a posição e os pontos de cada participante</label>
                        <div id="classification-list" style="margin-top: 10px;">
                            </div>
                    </div>
                </div>
            </div>
            
            <button type="submit" style="margin-top: 20px;">Gerar Jornal em PDF</button>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">← Voltar para o Ranking</a>
    </div>

    <script>
        const torneiosData = {{ todos_torneios | tojson }};

        function toggleClassification() {
            const container = document.getElementById('classificacao-container');
            const isChecked = document.getElementById('check_classificacao').checked;
            container.classList.toggle('hidden', !isChecked);
        }

        function populatePlayers() {
            const selectTorneio = document.getElementById('torneio_classificacao');
            const nomeTorneio = selectTorneio.value;
            const listContainer = document.getElementById('classification-list');
            listContainer.innerHTML = '';

            if (!nomeTorneio) return;

            const torneio = torneiosData.find(t => t.nome === nomeTorneio);
            
            if (torneio && torneio.participantes && torneio.participantes.length > 0) {
                torneio.participantes.forEach((jogador, index) => {
                    const newRow = document.createElement('div');
                    newRow.className = 'classification-row';
                    
                    const posInput = document.createElement('input');
                    posInput.type = 'number';
                    posInput.name = 'classificacao_posicao';
                    posInput.placeholder = 'Pos.';
                    posInput.className = 'pos-input';
                    posInput.value = index + 1;

                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'classificacao_jogador';
                    hiddenInput.value = jogador;

                    const label = document.createElement('label');
                    label.innerText = jogador;
                    label.className = 'player-label';

                    const pointsInput = document.createElement('input');
                    pointsInput.type = 'number';
                    pointsInput.name = 'classificacao_pontos';
                    pointsInput.placeholder = 'Pontos';
                    pointsInput.value = '0';

                    newRow.appendChild(posInput);
                    newRow.appendChild(hiddenInput);
                    newRow.appendChild(label);
                    newRow.appendChild(pointsInput);
                    listContainer.appendChild(newRow);
                });
            } else {
                listContainer.innerHTML = '<p style="color: var(--cor-texto-secundario-claro); font-size: 14px;">Nenhum participante cadastrado para este torneio. Adicione na página de "Gerenciar Torneios".</p>';
            }
        }
    </script>
</body>
</html>
