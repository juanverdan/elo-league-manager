<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login de Administrador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --cor-fundo-escuro: #1a1a1d; --cor-container-escuro: #2c2f33; --cor-texto-principal-claro: #e0e0e0;
            --cor-texto-secundario-claro: #a0a0a0; --cor-borda-escura: #4a4a4a; --cor-header-tabela: #2563eb;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--cor-fundo-escuro); background-image: linear-gradient(160deg, var(--cor-fundo-escuro) 0%, #3d3d4d 100%); color: var(--cor-texto-principal-claro); margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; background: var(--cor-container-escuro); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border: 1px solid var(--cor-borda-escura); }
        h1 { text-align: center; border-bottom: 1px solid var(--cor-borda-escura); padding-bottom: 15px; margin-top: 0; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 20px; }
        label { margin-bottom: 5px; color: var(--cor-texto-secundario-claro); font-weight: 500; }
        input, button { padding: 12px; border-radius: 6px; border: 1px solid var(--cor-borda-escura); font-size: 16px; width: 100%; box-sizing: border-box; background-color: #3d3d4d; color: var(--cor-texto-principal-claro); font-family: 'Inter', sans-serif; }
        button { background-color: var(--cor-header-tabela); color: white; font-weight: bold; cursor: pointer; border: none; transition: background-color 0.2s; }
        button:hover { background-color: #1e40af; }
        .flash-messages { list-style: none; padding: 0; margin-bottom: 20px; }
        .flash { padding: 15px; border-radius: 6px; color: white; font-weight: 500; text-align: center; }
        .flash.error { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-lock"></i> Acesso Restrito</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                {% for category, message in messages %}
                    <li class="flash {{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label for="password">Senha de Administrador</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
