<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Torneio</title>
    <style>
        /* O CSS com o tema escuro continua o mesmo */
    </style>
</head>
<body>
    <div class="container">
        <h1>🏅 Finalizar Torneio e Aplicar Bônus</h1>
        <form action="{{ url_for('finalizar_torneio') }}" method="post">
            <div class="form-group full-width">
                <label for="torneio_nome">Selecione o Torneio</label>
                <select name="torneio_nome" id="torneio_nome" required onchange="atualizarLabels()">
                    {% for t in torneios %}
                    <option value="{{ t.nome }}" data-tipo="{{ t.tipo }}">{{ t.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="campeao" id="label_campeao">🏆 Campeão</label>
                <select name="campeao" id="campeao" required>{% for j in jogadores %}<option value="{{ j }}">{{ j }}</option>{% endfor %}</select>
            </div>
            <div class="form-group">
                <label for="vice" id="label_vice">🥈 Vice-Campeão</label>
                <select name="vice" id="vice" required>{% for j in jogadores %}<option value="{{ j }}">{{ j }}</option>{% endfor %}</select>
            </div>
             <div class="form-group">
                <label for="semi1" id="label_semi1">🥉 Semifinalista 1</label>
                <select name="semi1" id="semi1" required>{% for j in jogadores %}<option value="{{ j }}">{{ j }}</option>{% endfor %}</select>
            </div>
             <div class="form-group">
                <label for="semi2" id="label_semi2">🥉 Semifinalista 2</label>
                <select name="semi2" id="semi2" required>{% for j in jogadores %}<option value="{{ j }}">{{ j }}</option>{% endfor %}</select>
            </div>
             <div class="form-group full-width">
                <label for="data_fim">Data de Término</label>
                <input type="date" name="data_fim" id="data_fim" required>
            </div>
            <div class="form-group full-width">
                <button type="submit">Finalizar e Salvar Resultados</button>
            </div>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">← Voltar para o Ranking</a>
    </div>

    <script>
        function atualizarLabels() {
            const select = document.getElementById('torneio_nome');
            const tipo = select.options[select.selectedIndex].getAttribute('data-tipo');

            if (tipo === 'Pontos Corridos') {
                document.getElementById('label_campeao').innerText = '🏆 1º Lugar';
                document.getElementById('label_vice').innerText = '🥈 2º Lugar';
                document.getElementById('label_semi1').innerText = '🥉 3º Lugar';
                document.getElementById('label_semi2').innerText = '🏅 4º Lugar';
            } else { // Mata-Mata
                document.getElementById('label_campeao').innerText = '🏆 Campeão';
                document.getElementById('label_vice').innerText = '🥈 Vice-Campeão';
                document.getElementById('label_semi1').innerText = '🥉 Semifinalista 1';
                document.getElementById('label_semi2').innerText = '🥉 Semifinalista 2';
            }
        }
        // Executa a função uma vez na carga inicial da página
        document.addEventListener('DOMContentLoaded', atualizarLabels);
    </script>
</body>
</html>
